[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "atlas",
    "clickhouse-connect>=1.9.0",
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "ta-lib>=0.8.2",
    "openpyxl>=3.1.2",
    "h3>=4.5.0",
]

[tool.uv.sources]
atlas = { path = "../../python/atlas", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
[tool.hatch.metadata]  
allow-direct-references = true  
