[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS Modular Monolith Backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "clickhouse-connect>=1.9.0",
    "cryptography>=50.0.2",
    "openbb-core>=2.0.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "valkey>=6.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "../../tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
